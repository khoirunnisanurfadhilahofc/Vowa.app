<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="vowaLogoBg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="45%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Wing Front Gradient -->
    <linearGradient id="vowaWingGrad2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Wing Right Layer Gradient -->
    <linearGradient id="vowaWingRightGrad2" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="70%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="vowaShadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2E1065" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ================= APP ICON (Top Centered) ================= -->
  <g transform="translate(100, 20)">
    <!-- Squircle Background -->
    <rect width="300" height="300" rx="76" fill="url(#vowaLogoBg)" />
    <!-- Inner border -->
    <rect x="4" y="4" width="292" height="292" rx="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

    <g filter="url(#vowaShadow2)">
      <!-- Head -->
      <circle cx="150" cy="100" r="24" fill="#FFFFFF" />

      <!-- Torso -->
      <path
        d="M 135,132 C 135,124 165,124 165,132 L 170,166 C 170,172 130,172 130,166 Z"
        fill="#DDD6FE"
      />

      <!-- Sound waves -->
      <path
        d="M 183,86 C 190,94 190,106 183,114"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
      />
      <path
        d="M 197,74 C 209,86 209,114 197,126"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        stroke-opacity="0.85"
      />

      <!-- Right Wing Layer (Behind) -->
      <path
        d="M 150,222
           C 172,222 198,195 214,165
           C 223,148 217,131 204,131
           C 191,131 180,144 172,158
           C 165,172 154,191 142,198
           Z"
        fill="url(#vowaWingRightGrad2)"
      />

      <!-- Main Protective V-Shape (Foreground) -->
      <path
        d="M 99,84
           C 111,76 125,84 131,98
           L 144,139
           C 150,161 158,180 150,202
           C 144,221 135,229 122,229
           C 106,229 94,214 82,188
           L 63,141
           C 56,124 58,106 70,93
           C 78,84 89,79 99,84
           Z"
        fill="url(#vowaWingGrad2)"
      />

      <!-- Right Upward Hand of V -->
      <path
        d="M 120,226
           C 134,228 150,219 165,204
           L 214,141
           C 224,129 237,128 244,138
           C 252,148 249,164 238,177
           L 181,237
           C 160,257 129,257 108,239
           L 104,234
           C 110,230 115,228 120,226
           Z"
        fill="url(#vowaWingGrad2)"
      />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY: VOWA ================= -->
  <!-- Color: Rich Brand Violet #3B0764 / #4C1D95 -->
  <g fill="#431C87" transform="translate(40, 360)">
    <!-- Letter V -->
    <path
      d="M 0,20
         C 0,8 10,0 22,0
         C 32,0 39,6 43,16
         L 70,88
         L 97,16
         C 101,6 108,0 118,0
         C 130,0 140,8 140,20
         C 140,25 138,30 135,37
         L 92,130
         C 87,141 78,146 70,146
         C 62,146 53,141 48,130
         L 5,37
         C 2,30 0,25 0,20 Z"
      transform="translate(10, 0)"
    />

    <!-- Letter O as Speech Bubble with 3 Dots -->
    <g transform="translate(155, 0)">
      <!-- Outer speech bubble circle + bottom-left speech pointer -->
      <path
        d="M 68,0
           C 105,0 136,31 136,68
           C 136,105 105,136 68,136
           C 54,136 41,131 31,124
           L 12,136
           C 7,139 1,136 2,130
           L 6,108
           C 2,96 0,82 0,68
           C 0,31 31,0 68,0 Z"
      />
      <!-- Hollow interior -->
      <circle cx="68" cy="68" r="44" fill="#FFFFFF" />
      <!-- Three Speech Dots inside the O -->
      <circle cx="48" cy="68" r="7" fill="#7C3AED" />
      <circle cx="68" cy="68" r="7" fill="#7C3AED" />
      <circle cx="88" cy="68" r="7" fill="#7C3AED" />
    </g>

    <!-- Letter W -->
    <path
      d="M 0,20
         C 0,8 10,0 21,0
         C 30,0 37,5 41,15
         L 62,75
         L 83,16
         C 86,6 93,0 102,0
         C 111,0 118,6 121,16
         L 142,75
         L 163,15
         C 167,5 174,0 183,0
         C 194,0 204,8 204,20
         C 204,24 202,30 199,37
         L 164,128
         C 160,139 151,146 141,146
         C 132,146 124,140 120,130
         L 102,78
         L 84,130
         C 80,140 72,146 63,146
         C 53,146 44,139 40,128
         L 5,37
         C 2,30 0,24 0,20 Z"
      transform="translate(295, 0)"
    />

    <!-- Letter A (Triangular chevron without crossbar) -->
    <path
      d="M 52,5
         C 59,-2 69,-2 76,5
         L 124,124
         C 127,131 128,137 128,141
         C 128,153 118,161 106,161
         C 97,161 90,156 86,146
         L 64,88
         L 42,146
         C 38,156 31,161 22,161
         C 10,161 0,153 0,141
         C 0,137 1,131 4,124
         Z"
      transform="translate(485, -15)"
    />
  </g>

  <!-- ================= TAGLINE ================= -->
  <text
    x="250"
    y="555"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#5B21B6"
    letter-spacing="0.5"
  >
    Your Voice, Your Safety
  </text>
</svg>
